<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EDF0F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1015" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Upper/Lower Training Log</title>
<style>
:root {
  /* Layout: one-column phone logbook. Sticky top bar, stacked exercise cards, fixed tab bar at the bottom. */
  --bg: #EDF0F4;
  --surface: #FFFFFF;
  --raised: #F5F7FA;
  --line: #D5DBE4;
  --ink: #131821;
  --muted: #586273;
  --accent: #2346C4;
  --accent-ink: #FFFFFF;
  --accent-soft: #E4EAFB;
  --good: #11784A; --good-bg: #E1F3E9; --good-ink: #FFFFFF;
  --warn: #8F5400; --warn-bg: #FAEED6;
  --bad: #B3261E; --bad-bg: #FBE3E0; --bad-ink: #FFFFFF;
  --shadow: 0 6px 22px rgba(19, 24, 33, .12);
  --display: "Big Shoulders Display", "Avenir Next Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --body: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 12px;
  --r-sm: 8px;
  --tabs-h: 60px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1015; --surface: #161A21; --raised: #1D222B; --line: #2B323D; --ink: #E6EAF0; --muted: #9AA4B3;
    --accent: #8AA4FF; --accent-ink: #0A0F1F; --accent-soft: #1E2745;
    --good: #52C690; --good-bg: #13291F; --good-ink: #07150E;
    --warn: #EBA53E; --warn-bg: #2E2312;
    --bad: #FF7A70; --bad-bg: #331A18; --bad-ink: #1A0907;
    --shadow: 0 6px 22px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1015; --surface: #161A21; --raised: #1D222B; --line: #2B323D; --ink: #E6EAF0; --muted: #9AA4B3;
  --accent: #8AA4FF; --accent-ink: #0A0F1F; --accent-soft: #1E2745;
  --good: #52C690; --good-bg: #13291F; --good-ink: #07150E;
  --warn: #EBA53E; --warn-bg: #2E2312;
  --bad: #FF7A70; --bad-bg: #331A18; --bad-ink: #1A0907;
  --shadow: 0 6px 22px rgba(0, 0, 0, .45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body); -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
p { margin: 0; }
h1, h2, h3 { margin: 0; text-wrap: balance; }

.app { max-width: 560px; margin-inline: auto; padding-inline: 16px; padding-block: 0 calc(var(--tabs-h) + 48px + env(safe-area-inset-bottom, 0px)); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; margin-inline: -16px; padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand-name { font: 800 24px/1 var(--display); letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-sub { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-top: 4px; min-width: 0; }
.brand-sub span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--good); }
.dot.wait { background: var(--warn); }
.dot.err { background: var(--bad); }
.phase-btn { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; font-weight: 600; font-size: 13px; white-space: nowrap; }
.view { padding-top: 14px; }
.stack { display: flex; flex-direction: column; gap: 12px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; }
.sec-title { font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.small { font-size: 13px; color: var(--muted); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* week strip + day picker */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.wd { text-align: center; font-size: 11px; color: var(--muted); }
.wd .m { margin-top: 3px; min-height: 24px; border-radius: 6px; background: var(--raised); border: 1px solid var(--line); font: 500 11px/22px var(--mono); color: var(--ink); overflow: hidden; }
.wd .m.has { background: var(--accent-soft); border-color: transparent; }
.wd.today .d { color: var(--ink); font-weight: 700; }
.week-sum { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.week-sum b { color: var(--ink); font-weight: 600; }
.days { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-top: 4px; }
.day-btn { position: relative; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 9px 2px 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 60px; min-width: 0; }
.day-btn .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.day-btn .v { font: 800 23px/1 var(--display); }
.day-btn.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.day-btn.on .k { color: inherit; }
.day-btn .next { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; background: var(--ink); color: var(--bg); padding: 1px 6px; border-radius: 999px; white-space: nowrap; }

/* session head */
.shead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.shead h1 { font: 800 34px/0.95 var(--display); text-transform: uppercase; letter-spacing: .01em; }
.shead .focus { font-size: 13px; color: var(--muted); margin-top: 4px; }
.date-in { height: 40px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); padding: 0 10px; font: 500 16px var(--mono); min-width: 0; max-width: 100%; }

/* banners */
.banner { padding: 10px 12px; border-radius: var(--r-sm); font-size: 14px; }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
.banner.bad { background: var(--bad-bg); color: var(--bad); }
.banner.good { background: var(--good-bg); color: var(--good); }
.banner.info { background: var(--accent-soft); color: var(--ink); }
.banner .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

/* exercise cards */
.ex-head { display: flex; align-items: baseline; justify-content: space-between; gap: 4px 10px; flex-wrap: wrap; }
.ex-name { font-size: 16px; font-weight: 600; }
.presc { font: 500 13px/1.3 var(--mono); color: var(--muted); white-space: nowrap; }
.muscles { margin-top: 3px; font-size: 13px; color: var(--muted); }
.muscles b { color: var(--ink); font-weight: 600; }
.ex-note { margin-top: 6px; font-size: 13px; color: var(--muted); }
.last { margin-top: 8px; font: 500 13px/1.45 var(--mono); color: var(--muted); }
.rec { display: flex; gap: 8px; align-items: flex-start; margin-top: 10px; font-size: 14px; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 4px; font: 600 12px/1 var(--body); padding: 5px 8px; border-radius: 999px; background: var(--raised); color: var(--ink); border: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip.up { background: var(--good-bg); color: var(--good); border-color: transparent; }
.chip.miss, .chip.drop { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.chip.knee { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.chip.new { background: var(--accent-soft); color: var(--ink); border-color: transparent; }
.sets { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.set { display: grid; grid-template-columns: 20px minmax(0, 1fr) 12px minmax(0, 1fr) 44px; align-items: center; gap: 6px; }
.set.reps-only { grid-template-columns: 20px minmax(0, 1fr) 44px; }
.set-i { font: 500 13px var(--mono); color: var(--muted); text-align: center; }
.cell { position: relative; display: block; min-width: 0; }
.num { width: 100%; height: 44px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--raised); color: var(--ink); font: 500 17px/1 var(--mono); font-variant-numeric: tabular-nums; text-align: center; padding: 0 30px 0 6px; -webkit-appearance: none; appearance: none; }
.num::placeholder { color: var(--muted); opacity: .75; }
.cell .u { position: absolute; right: 7px; top: 50%; transform: translateY(-50%); font-size: 10px; color: var(--muted); pointer-events: none; }
.x { text-align: center; color: var(--muted); }
.tick { width: 44px; height: 44px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--muted); padding: 0; }
.set.done .tick { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.addset { align-self: flex-start; background: none; border: none; color: var(--accent); font-weight: 600; padding: 6px 2px; font-size: 14px; }
.side { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
.side-name { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.fb:empty { display: none; }
.fb-msg { margin-top: 8px; font-size: 13px; color: var(--warn); background: var(--warn-bg); padding: 8px 10px; border-radius: var(--r-sm); }

/* forms */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > span { font-size: 13px; color: var(--muted); }
.in, .sel, .ta { width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--raised); color: var(--ink); padding: 8px 10px; font-size: 16px; min-width: 0; }
.ta { min-height: 70px; resize: vertical; line-height: 1.4; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; }
.seg.col { grid-auto-flow: row; }
.seg-btn { min-height: 44px; border: 1px solid var(--line); background: var(--raised); border-radius: var(--r-sm); padding: 8px 10px; font-size: 14px; text-align: center; }
.seg-btn.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.seg-btn.bad.on { background: var(--bad); border-color: var(--bad); color: var(--bad-ink); }
.btn { min-height: 44px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 8px 14px; font-weight: 600; font-size: 14px; }
.btn.accent { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn.danger.solid { background: var(--bad); color: var(--bad-ink); border-color: var(--bad); }
.btn.link { border: none; background: none; color: var(--accent); padding-inline: 2px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }

/* save bar */
.savebar { position: sticky; bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom, 0px)); z-index: 4; margin-inline: -16px; padding: 8px 16px; background: linear-gradient(to top, var(--bg) 55%, transparent); }
.savebar-in { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 8px 8px 12px; box-shadow: var(--shadow); }
.count { font: 500 13px var(--mono); color: var(--muted); white-space: nowrap; }
.primary { flex: 1; min-height: 46px; border: none; border-radius: var(--r-sm); background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 16px; }
.err-msg { color: var(--bad); font-size: 14px; }
body.typing .tabs { display: none; }
body.typing .savebar { bottom: 0; }

/* result panel */
.result h2 { font: 800 24px/1 var(--display); text-transform: uppercase; }
.rlist { list-style: none; margin: 10px 0 0; padding: 0; }
.rlist li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 9px 0; border-top: 1px solid var(--line); align-items: center; }
.rlist .t { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }

/* progress */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 10px; min-width: 0; }
.stat .n { font: 800 30px/1 var(--display); font-variant-numeric: tabular-nums; }
.stat .n.up { color: var(--good); }
.stat .n.down { color: var(--bad); }
.stat .l { font-size: 12px; color: var(--muted); margin-top: 5px; }
.prow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 0; border-top: 1px solid var(--line); align-items: center; }
.plist-in > .prow:first-child { border-top: none; padding-top: 2px; }
.prow .nm { font-weight: 600; }
.prow .vals { font: 500 13px/1.45 var(--mono); color: var(--muted); }
.prow .vals b { color: var(--ink); font-weight: 500; }
.pright { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.spark { width: 112px; height: 34px; display: block; }
.spark .ln { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.spark .ar { fill: var(--accent-soft); stroke: none; }
.spark .pt { fill: var(--accent); stroke: var(--surface); stroke-width: 1.5; }
.spark .base { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 3; }
.pct { font: 800 22px/1 var(--display); font-variant-numeric: tabular-nums; }
.pct.up { color: var(--good); }
.pct.down { color: var(--bad); }
.pct.flat { color: var(--muted); }
.lsi { margin-top: 8px; }
.lsi-bar { position: relative; height: 10px; border-radius: 5px; background: var(--raised); border: 1px solid var(--line); }
.lsi-fill { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 5px; background: var(--accent); }
.lsi-fill.ok { background: var(--good); }
.lsi-mark { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); }
.lsi-legend { position: relative; height: 16px; font-size: 11px; color: var(--muted); margin-top: 4px; }
.lsi-legend span { position: absolute; transform: translateX(-50%); }
.empty { text-align: left; padding: 22px 16px; }
.empty h2 { font: 800 26px/1 var(--display); text-transform: uppercase; }
.empty p { margin-top: 8px; color: var(--muted); }

/* history */
.hweek { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 6px 2px -4px; }
.hrow { width: 100%; text-align: left; display: grid; grid-template-columns: 82px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.hrow .dt { font: 500 13px var(--mono); color: var(--muted); }
.hrow .nm { font-weight: 600; }
.hrow .sm { font-size: 13px; color: var(--muted); }

/* plan */
.plist { list-style: none; margin: 0; padding: 0; }
.plist li { padding: 10px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: start; }
.plist li:first-child { border-top: none; padding-top: 2px; }
.plist .pn { font-weight: 600; }
.plist .pm { font-size: 13px; color: var(--muted); grid-column: 1 / -1; }
.plist .pp { font: 500 13px var(--mono); color: var(--muted); white-space: nowrap; }
.step-edit { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; margin-top: 4px; font-size: 13px; color: var(--muted); }
.step-edit .in { width: 90px; min-height: 36px; padding: 4px 8px; }
.vol { width: 100%; border-collapse: collapse; font-size: 14px; }
.vol th, .vol td { padding: 7px 4px; border-top: 1px solid var(--line); text-align: left; vertical-align: top; }
.vol th { font-size: 12px; color: var(--muted); font-weight: 600; border-top: none; }
.vol .n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.gate { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); align-items: start; }
.gate .ic { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; color: transparent; }
.gate.ok .ic { background: var(--good); border-color: var(--good); color: var(--good-ink); }
.gate .gl { font-size: 14px; }
.gate .gd { font-size: 13px; color: var(--muted); }
.gate .btn.link { padding: 2px 0; min-height: 0; font-size: 13px; }
.rules { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.rts { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr) 48px; gap: 6px; align-items: center; font-size: 13px; }
.rts .in { min-height: 38px; padding: 4px 6px; text-align: center; font-family: var(--mono); }
.rts .h { color: var(--muted); font-size: 12px; }
.rts .p { font: 500 13px var(--mono); text-align: right; }
.rts .p.ok { color: var(--good); }
.tablewrap { overflow-x: auto; }
.copybox { width: 100%; min-height: 120px; font: 12px/1.4 var(--mono); }

/* tabs + toast */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs-in { max-width: 560px; margin-inline: auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.tab { height: var(--tabs-h); border: none; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 500; color: var(--muted); position: relative; }
.tab svg { width: 22px; height: 22px; }
.tab.on { color: var(--accent); }
.tab.on::before { content: ""; position: absolute; top: 0; left: 32%; right: 32%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom, 0px) + 80px); z-index: 7; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; max-width: calc(100% - 32px); text-align: center; box-shadow: var(--shadow); }
@media (prefers-reduced-motion: no-preference) {
  .seg-btn, .day-btn, .tick, .btn, .primary { transition: background-color .15s ease, border-color .15s ease, color .15s ease; }
}
@media (min-width: 420px) {
  .set { grid-template-columns: 24px minmax(0, 1fr) 14px minmax(0, 1fr) 46px; gap: 8px; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <span class="brand-name">Upper/Lower Log</span>
      <span class="brand-sub" id="brandSub"><span class="dot" id="syncDot"></span><span id="syncText">Loading…</span></span>
    </div>
    <button class="phase-btn" id="phaseBtn" type="button">Knee phase 1</button>
  </header>
  <main id="view" class="view" aria-live="polite"></main>
</div>
<nav class="tabs" aria-label="Sections">
  <div class="tabs-in">
    <button class="tab" type="button" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 10v4M6 7v10M18 7v10M21 10v4M6 12h12"/></svg>Today</button>

/* ================= backup ================= */
async function exportData() {
  const data = JSON.stringify({ app: "upper-lower-log", v: 1, exportedAt: new Date().toISOString(), settings: S.settings, sessions: Object.values(S.sessions) }, null, 1);
  const filename = "training-log-" + todayISO() + ".json";
  const C = window.claude;
  if (C && typeof C.use === "function") {
    let dl = null; try { dl = await C.use("downloads"); } catch (e) { dl = null; }
    if (dl) {
      try { await dl.save({ filename, data }); markBackedUp(); toast("Backup saved"); }
      catch (e) { if (e && e.code === "declined") toast("Backup not saved"); else showCopy(data); }
      return;
    }
    showCopy(data); return;
  }
  // Phone: the share sheet offers "Save to Files", which works from a Home Screen app.
  try {
    const file = new File([data], filename, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); markBackedUp(); toast("Backup saved"); }
      catch (e) { if (!e || e.name !== "AbortError") showCopy(data); }
      return;
    }
  } catch (e) { /* no file sharing here: fall through to a download */ }
  try {
    const a = el("a", { href: URL.createObjectURL(new Blob([data], { type: "application/json" })), download: filename });
    document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    markBackedUp(); toast("Backup downloaded");
  } catch (e) { showCopy(data); }
}
function markBackedUp() { S.settings.lastBackupAt = Date.now(); touchSettings(); rerender(); }
const notBackedUp = () => liveSessions().filter(s => (+s.updatedAt || 0) > (+S.settings.lastBackupAt || 0)).length;

function backupBlock(note) {
